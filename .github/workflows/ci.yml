name: CI

on:
    push:
        branches: [master]
        tags: ['v*']
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write # needed to create the GitHub release on tags
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 14
                  cache: npm
                  registry-url: https://registry.npmjs.org

            # epoll (via rpi-gpio) is built with an old node-gyp that does not support Python 3.11+
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.10'

            - run: npm ci
            - run: npm run lint
            - run: npm run build-release

            - name: Create GitHub release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  files: garage-door-opener-*.tgz

            - name: Publish node-red-contrib-rpi-garage-door to npm
              if: startsWith(github.ref, 'refs/tags/')
              working-directory: node-red-contrib-garage-door
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
